services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tixenex-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}"
      MSSQL_PID: "Express"
    volumes:
      - sql_data:/var/opt/mssql
    ports:
      - "127.0.0.1:14333:1433"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: tixenex-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?RABBITMQ_USER must be set}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  minio:
    image: quay.io/minio/minio:latest
    container_name: tixenex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.api
    container_name: tixenex-api

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"

      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__Microsoft.Hosting.Lifetime: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning

      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TixeNex;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set};Encrypt=True;TrustServerCertificate=True"

      Jwt__Issuer: "TixeNex"
      Jwt__Audience: "TixeNex.UI"
      Jwt__Key: "${JWT_KEY:?JWT_KEY must be set}"
      Jwt__AccessTokenMinutes: "60"

      SeedUsers__Admin__Password: "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}"
      SeedUsers__Agent__Password: "${SEED_AGENT_PASSWORD:?SEED_AGENT_PASSWORD must be set}"
      SeedUsers__User__Password: "${SEED_USER_PASSWORD:?SEED_USER_PASSWORD must be set}"

      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__UserName: "${RABBITMQ_USER:?RABBITMQ_USER must be set}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}"

      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
      Minio__BucketName: "exports"
      Minio__UseSsl: "false"

      FileStorage__RootPath: "/app/App_Data/attachments"

      Demo__Enabled: "true"
      Demo__SlidingLifetimeMinutes: "30"
      Demo__AbsoluteLifetimeMinutes: "90"
      Demo__MaxActiveUsers: "50"
      Demo__AllowedRoles__0: "User"
      Demo__AllowedRoles__1: "Agent"
      Demo__AllowedRoles__2: "Admin"

      UseHttpsRedirection: "false"

    volumes:
      - api_attachments:/app/App_Data/attachments
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys

    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker
    container_name: tixenex-worker

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

    environment:
      DOTNET_ENVIRONMENT: "Production"

      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning

      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TixeNex;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set};Encrypt=True;TrustServerCertificate=True"

      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__UserName: "${RABBITMQ_USER:?RABBITMQ_USER must be set}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}"

      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
      Minio__BucketName: "exports"
      Minio__UseSsl: "false"

    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.ui
    container_name: tixenex-ui

    depends_on:
      api:
        condition: service_started

    ports:
      - "127.0.0.1:8080:80"

    restart: unless-stopped

volumes:
  sql_data:
  api_attachments:
  rabbitmq_data:
  minio_data:
  dataprotection_keys:
