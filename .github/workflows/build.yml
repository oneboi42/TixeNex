name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\TixeNex.slnx

      - name: Build
        run: dotnet build .\TixeNex.slnx --configuration Release --no-restore

      - name: Test UI
        run: dotnet test .\tests\TixeNex.UI.Tests\TixeNex.UI.Tests.csproj --configuration Release --no-build

      - name: Test Worker
        run: dotnet test .\tests\TixeNex.Worker.Tests\TixeNex.Worker.Tests.csproj --configuration Release --no-build

      - name: Test API Integration
        run: dotnet test .\tests\TixeNex.Api.IntegrationTests\TixeNex.Api.IntegrationTests.csproj --configuration Release --no-build
